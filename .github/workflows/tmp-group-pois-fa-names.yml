name: Temporary grouped POI controls

on:
  push:
    branches:
      - agent/group-pois-fa-area-names

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply grouped POI controls'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/group-pois-fa-area-names

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Apply changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          # Add semantic POI groups used by all map views.
          path = Path('src/config/pois.ts')
          text = path.read_text()
          marker = '\nexport function poiCategoryDefinition(category: PoiCategory): PoiCategoryDefinition {'
          group_code = '''
          export interface PoiCategoryGroupDefinition {
            id: 'daily-life' | 'education' | 'health-safety' | 'leisure' | 'transport' | 'services'
            labels: Record<AppLanguage, string>
            categories: PoiCategory[]
          }

          export const POI_CATEGORY_GROUPS: PoiCategoryGroupDefinition[] = [
            {
              id: 'daily-life',
              labels: { en: 'Daily life', fi: 'Arki', fa: 'زندگی روزمره' },
              categories: ['supermarkets', 'restaurants', 'cafes', 'shopping'],
            },
            {
              id: 'education',
              labels: { en: 'Education', fi: 'Koulutus', fa: 'آموزش' },
              categories: ['universities', 'schools', 'daycare', 'libraries'],
            },
            {
              id: 'health-safety',
              labels: { en: 'Health & safety', fi: 'Terveys ja turvallisuus', fa: 'سلامت و امنیت' },
              categories: ['healthcare', 'police'],
            },
            {
              id: 'leisure',
              labels: { en: 'Leisure & outdoors', fi: 'Vapaa-aika', fa: 'تفریح و فضای باز' },
              categories: ['attractions', 'parks-playgrounds', 'sports'],
            },
            {
              id: 'transport',
              labels: { en: 'Transport', fi: 'Liikenne', fa: 'حمل‌ونقل' },
              categories: ['bus-stops', 'train-stations', 'airports'],
            },
            {
              id: 'services',
              labels: { en: 'Services', fi: 'Palvelut', fa: 'خدمات' },
              categories: ['banking', 'post-services', 'fuel-charging'],
            },
          ]
          '''.strip('\n')
          text = replace_once(text, marker, f'\n{group_code}\n\nexport function poiCategoryDefinition(category: PoiCategory): PoiCategoryDefinition {{', 'POI group insertion')
          path.write_text(text)

          # Keep Persian major-area names stable even when OSM/Wikidata lacks name:fa.
          path = Path('src/i18n.ts')
          text = path.read_text()
          start = text.index('export function localizeAreaName(')
          end = text.index('\n\nexport function useI18n()', start)
          replacement = '''const PERSIAN_MAJOR_AREA_NAMES: Record<string, string> = {
            Keskusta: 'مرکز شهر',
            Vöyrinkaupunki: 'وُیرین‌کاوپونکی',
            Vaskiluoto: 'واسکی‌لوتو',
            Palosaari: 'پالوساری',
            Gerby: 'گربی',
            Kotiranta: 'کوتی‌رانتا',
            Huutoniemi: 'هوتونیمی',
            Ristinummi: 'ریستینومی',
            Höstvesi: 'هوست‌وسی',
            Suvilahti: 'سووی‌لاهتی',
            Sundom: 'سوندوم',
            Vähäkyrö: 'وهاکورو',
          }

          function toPersianDigits(value: string): string {
            const digits = '۰۱۲۳۴۵۶۷۸۹'
            return value.replace(/\\d/g, (digit) => digits[Number(digit)] ?? digit)
          }

          function persianAreaNameFallback(names: LocalizedAreaNames | undefined, fallback: string): string {
            const finnishName = names?.fi || fallback
            for (const [source, persian] of Object.entries(PERSIAN_MAJOR_AREA_NAMES)) {
              if (finnishName === source) return persian
              if (finnishName.startsWith(`${source} `)) {
                return `${persian} ${toPersianDigits(finnishName.slice(source.length + 1))}`
              }
            }
            return toPersianDigits(finnishName)
          }

          export function localizeAreaName(
            names: LocalizedAreaNames | undefined,
            fallback: string,
            targetLanguage: AppLanguage = language.value,
          ): string {
            if (targetLanguage === 'fa') return names?.fa || persianAreaNameFallback(names, fallback)
            return localizeText(names, fallback, targetLanguage)
          }'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

          # Regression tests for deterministic Persian fallback.
          path = Path('src/i18n.spec.ts')
          text = path.read_text()
          text = replace_once(
              text,
              "  it('falls back to the Finnish OSM name when a translation is missing', () => {\n    expect(localizeAreaName({ fi: 'Gerby' }, 'Gerby', 'fa')).toBe('Gerby')\n  })",
              "  it('uses the stable Persian major-area fallback when a source translation is missing', () => {\n    expect(localizeAreaName({ fi: 'Gerby', en: 'Gerby major district' }, 'Gerby', 'fa')).toBe(\n      'گربی',\n    )\n    expect(localizeAreaName({ fi: 'Keskusta 4', en: 'Keskusta 4' }, 'Keskusta 4', 'fa')).toBe(\n      'مرکز شهر ۴',\n    )\n  })\n\n  it('prefers the Finnish source name over an English fallback in Persian mode', () => {\n    expect(\n      localizeAreaName({ fi: 'Hietalahti 9', en: 'English area name' }, 'Hietalahti 9', 'fa'),\n    ).toBe('Hietalahti ۹')\n  })",
              'i18n regression test',
          )
          path.write_text(text)

          # Group categories and make all POIs opt-in by default on every map.
          component_paths = [
              Path('src/components/map/VaasaMap.vue'),
              Path('src/components/areas/AreaDetail.vue'),
              Path('src/components/areas/PienalueDetail.vue'),
          ]

          grouped_template = '''__I__<div class="poi-control__groups">
          __I__  <section v-for="group in POI_CATEGORY_GROUPS" :key="group.id" class="poi-control__group">
          __I__    <h3>{{ group.labels[language] }}</h3>
          __I__    <div class="poi-control__categories">
          __I__      <button
          __I__        v-for="category in group.categories"
          __I__        :key="category"
          __I__        type="button"
          __I__        :class="[
          __I__          'poi-control__category',
          __I__          { 'is-active': isPoiCategoryActive(category) },
          __I__        ]"
          __I__        :aria-pressed="isPoiCategoryActive(category)"
          __I__        @click="togglePoiCategory(category)"
          __I__      >
          __I__        <i
          __I__          :style="{ backgroundColor: poiCategoryDefinition(category).color }"
          __I__          aria-hidden="true"
          __I__        />
          __I__        {{ poiCategoryDefinition(category).labels[language] }}
          __I__        <span>{{ numberFormatter.format(poiCategoryCount(category)) }}</span>
          __I__      </button>
          __I__    </div>
          __I__  </section>
          __I__</div>'''

          for path in component_paths:
              text = path.read_text()
              if path.name == 'VaasaMap.vue':
                  text = replace_once(
                      text,
                      "import { POI_CATEGORY_DEFINITIONS, poiCategoryDefinition } from '@/config/pois'",
                      "import { POI_CATEGORY_GROUPS, poiCategoryDefinition } from '@/config/pois'",
                      f'{path}: POI import',
                  )
              else:
                  text = replace_once(
                      text,
                      "import { POI_CATEGORY_DEFINITIONS } from '@/config/pois'",
                      "import { POI_CATEGORY_GROUPS, poiCategoryDefinition } from '@/config/pois'",
                      f'{path}: POI import',
                  )
              text = replace_once(
                  text,
                  'const activePoiCategories = ref<PoiCategory[]>([...POI_CATEGORIES])',
                  'const activePoiCategories = ref<PoiCategory[]>([])',
                  f'{path}: default POI visibility',
              )

              marker = '<div class="poi-control__categories">'
              marker_position = text.index(marker)
              line_start = text.rfind('\n', 0, marker_position) + 1
              indent = text[line_start:marker_position]
              closing = '\n' + indent + '</div>'
              closing_position = text.index(closing, marker_position) + len(closing)
              replacement_block = grouped_template.replace('__I__', indent)
              text = text[:line_start] + replacement_block + text[closing_position:]
              path.write_text(text)

          # Group-card layout for the 19 category buttons.
          path = Path('src/styles/pois.css')
          text = path.read_text()
          if '.poi-control__groups {' in text:
              raise SystemExit('POI group styles already exist unexpectedly')
          text += '''

          .poi-control__groups {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
            gap: 0.6rem;
          }

          .poi-control__group {
            display: grid;
            align-content: start;
            gap: 0.4rem;
            padding: 0.55rem;
            border: 1px solid rgba(23, 100, 93, 0.13);
            border-radius: 0.55rem;
            background: rgba(255, 253, 248, 0.7);
          }

          .poi-control__group h3 {
            margin: 0;
            color: #52625e;
            font-size: 0.72rem;
            font-weight: 800;
          }

          .poi-control__group .poi-control__categories {
            align-content: flex-start;
          }
          '''
          path.write_text(text)

          # Verify every POI category belongs to exactly one group.
          Path('src/config/pois.spec.ts').write_text('''import { describe, expect, it } from 'vitest'\n\nimport { POI_CATEGORY_GROUPS } from '@/config/pois'\nimport { POI_CATEGORIES } from '@/domain/pois'\n\ndescribe('POI category groups', () => {\n  it('places every category in exactly one group', () => {\n    const grouped = POI_CATEGORY_GROUPS.flatMap((group) => group.categories)\n    expect(grouped).toHaveLength(POI_CATEGORIES.length)\n    expect(new Set(grouped)).toEqual(new Set(POI_CATEGORIES))\n  })\n\n  it('keeps universities, schools, day care, and libraries together', () => {\n    expect(POI_CATEGORY_GROUPS.find((group) => group.id === 'education')?.categories).toEqual([\n      'universities',\n      'schools',\n      'daycare',\n      'libraries',\n    ])\n  })\n})\n''')
          PY

      - name: Format
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/config/pois.ts src/config/pois.spec.ts src/i18n.ts src/i18n.spec.ts src/components/map/VaasaMap.vue src/components/areas/AreaDetail.vue src/components/areas/PienalueDetail.vue src/styles/pois.css
          git commit -m "Apply grouped POI controls"
          git push origin HEAD:agent/group-pois-fa-area-names
