name: Temporary E1 events snapshot

on:
  push:
    branches: [agent/events-e1-parser-snapshot]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/events-e1-parser-snapshot
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate and validate live events snapshot
        run: npm run events:update
      - name: Commit generated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/events.json
          if git diff --cached --quiet; then
            echo "Events snapshot is already current"
            exit 0
          fi
          git commit -m "Generate current Vaasa events snapshot"
          git push origin HEAD:agent/events-e1-parser-snapshot
