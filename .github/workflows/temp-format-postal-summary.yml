name: Temporary format postal summary

on:
  push:
    branches:
      - agent/align-postal-mobile-summary
    paths:
      - .github/workflows/temp-format-postal-summary.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/align-postal-mobile-summary
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write src/components/postal/PostalCodeDetail.vue src/components/postal/PostalStatisticsSummary.vue
      - name: Commit formatter output
        run: |
          if git diff --quiet -- src/components/postal/PostalCodeDetail.vue src/components/postal/PostalStatisticsSummary.vue; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/postal/PostalCodeDetail.vue src/components/postal/PostalStatisticsSummary.vue
          git commit -m "Format postal detail summary"
          git push origin HEAD:agent/align-postal-mobile-summary
