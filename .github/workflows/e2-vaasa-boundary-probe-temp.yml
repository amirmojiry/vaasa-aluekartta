name: Temporary E2 Vaasa boundary probe

on:
  push:
    branches: [agent/events-e2-location-resolution]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe OSM Vaasa municipality relation
        run: |
          node --input-type=module <<'NODE'
          const query = '[out:json];rel["boundary"="administrative"]["name"="Vaasa"];out bb tags;'
          const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`
          const response = await fetch(url, {
            headers: {
              Accept: 'application/json',
              'User-Agent': 'vaasa-aluekartta-e2-boundary-probe/1.0 (+https://github.com/amirmojiry/vaasa-aluekartta)',
            },
            signal: AbortSignal.timeout(30000),
          })
          if (!response.ok) throw new Error(`Overpass HTTP ${response.status}: ${await response.text()}`)
          const data = await response.json()
          console.log(JSON.stringify(data.elements.map(({ id, bounds, tags }) => ({
            id,
            bounds,
            tags: {
              name: tags?.name,
              nameFi: tags?.['name:fi'],
              nameSv: tags?.['name:sv'],
              adminLevel: tags?.admin_level,
              boundary: tags?.boundary,
              wikidata: tags?.wikidata,
            },
          })), null, 2))
          NODE
