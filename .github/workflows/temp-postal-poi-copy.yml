name: Temporary postal POI copy fix

on:
  push:
    branches:
      - agent/small-ui-followups
    paths:
      - .github/workflows/temp-postal-poi-copy.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/small-ui-followups
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix postal POI copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/postal/PostalCodeDetail.vue')
          text = path.read_text()
          text = text.replace("      source: 'منبع',", "      source: 'منبع',\n      poiHint: 'فقط مکان‌های مهم داخل همین منطقه کد پستی نمایش داده می‌شوند.',\n      fitPlaces: 'نمایش همه مکان‌های این کد پستی',")
          text = text.replace("      source: 'Lähde',", "      source: 'Lähde',\n      poiHint: 'Vain tämän postinumeroalueen sisällä olevat paikat näytetään.',\n      fitPlaces: 'Näytä kaikki tämän postinumeroalueen paikat',")
          text = text.replace("    source: 'Source',", "    source: 'Source',\n    poiHint: 'Only places inside this postal code area are shown.',\n    fitPlaces: 'Show all places in this postal code area',")
          text = text.replace("<small>{{ poiLabel('allAreasHint') }}</small>", "<small>{{ labels.poiHint }}</small>")
          text = text.replace("{{ poiLabel('showAllVaasa') }}", "{{ labels.fitPlaces }}")
          path.write_text(text)
          PY
          npm install --no-audit --no-fund
          npx prettier --write src/components/postal/PostalCodeDetail.vue
          npm run lint -- --fix
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/postal/PostalCodeDetail.vue
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Clarify postal POI controls"
          git push origin HEAD:agent/small-ui-followups
