name: Temporary E1 formatting

on:
  push:
    branches: [agent/events-e1-parser-snapshot]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/events-e1-parser-snapshot
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Format repository
        run: npm run format
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/events.json scripts/lib/events-rss.mjs scripts/lib/events-rss.spec.mjs scripts/lib/events-validation.mjs scripts/update-events.mjs
          if git diff --cached --quiet; then
            echo "Formatting already clean"
            exit 0
          fi
          git commit -m "Format E1 event ingestion files"
          git push origin HEAD:agent/events-e1-parser-snapshot
