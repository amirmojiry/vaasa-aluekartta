name: Refresh POI snapshot

on:
  push:
    branches:
      - agent/education-transport-pois

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh POI snapshot
        run: npm run pois:update
      - name: Validate POI snapshot
        run: npm run pois:check
      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/vaasa-pois.geojson
          if git diff --cached --quiet; then
            echo "POI snapshot is already current"
            exit 0
          fi
          git commit -m "data: refresh education and transport POIs"
          git push
