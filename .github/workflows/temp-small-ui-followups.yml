name: Temporary small UI followups

on:
  push:
    branches:
      - agent/small-ui-followups
    paths:
      - .github/workflows/temp-small-ui-followups.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/small-ui-followups
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply UI followups
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Remove the GitHub link from the home header.
          app = Path('src/App.vue')
          text = app.read_text()
          text = text.replace('          <a class="topbar__link" href="https://github.com/amirmojiry/vaasa-aluekartta">GitHub</a>\n', '')
          app.write_text(text)

          # 2) Add language-specific English Wikipedia metadata and expose only the active language on party pages.
          service = Path('src/services/electionStatistics.ts')
          text = service.read_text()
          text = text.replace("export interface PartyWikipediaLinks {\n  fa?: string\n  fi?: string\n}", "export interface PartyWikipediaLinks {\n  en?: string\n  fa?: string\n  fi?: string\n}")
          replacements = {
            "RKP: {\n    fa:": "RKP: {\n    en: 'https://en.wikipedia.org/wiki/Swedish_People%27s_Party_of_Finland',\n    fa:",
            "SDP: {\n    fa:": "SDP: {\n    en: 'https://en.wikipedia.org/wiki/Social_Democratic_Party_of_Finland',\n    fa:",
            "KOK: {\n    fa:": "KOK: {\n    en: 'https://en.wikipedia.org/wiki/National_Coalition_Party',\n    fa:",
            "PS: {\n    fa:": "PS: {\n    en: 'https://en.wikipedia.org/wiki/Finns_Party',\n    fa:",
            "VIHR: {\n    fa:": "VIHR: {\n    en: 'https://en.wikipedia.org/wiki/Green_League',\n    fa:",
            "VAS: {\n    fa:": "VAS: {\n    en: 'https://en.wikipedia.org/wiki/Left_Alliance_(Finland)',\n    fa:",
            "KESK: {\n    fa:": "KESK: {\n    en: 'https://en.wikipedia.org/wiki/Centre_Party_(Finland)',\n    fa:",
            "KD: {\n    fa:": "KD: {\n    en: 'https://en.wikipedia.org/wiki/Christian_Democrats_(Finland)',\n    fa:",
            "LIIK: {\n    fi:": "LIIK: {\n    en: 'https://en.wikipedia.org/wiki/Movement_Now',\n    fi:",
          }
          for old, new in replacements.items():
            text = text.replace(old, new)
          service.write_text(text)

          spec = Path('src/services/electionStatistics.spec.ts')
          text = spec.read_text()
          text = text.replace("it('returns verified Finnish and Persian Wikipedia links for major parties'", "it('returns localized Wikipedia links for major parties'")
          text = text.replace("expect(partyWikipediaLinks('RKP')).toEqual({\n      fa:", "expect(partyWikipediaLinks('RKP')).toEqual({\n      en: 'https://en.wikipedia.org/wiki/Swedish_People%27s_Party_of_Finland',\n      fa:")
          spec.write_text(text)

          party = Path('src/components/analysis/PartyAnalysisPage.vue')
          text = party.read_text()
          text = text.replace("    dedicated: 'Dedicated page',", "    dedicated: 'Dedicated page',\n    wikipedia: 'Wikipedia',")
          text = text.replace("    dedicated: 'Oma sivu',", "    dedicated: 'Oma sivu',\n    wikipedia: 'Wikipedia',")
          text = text.replace("    dedicated: 'صفحه اختصاصی',", "    dedicated: 'صفحه اختصاصی',\n    wikipedia: 'ویکی‌پدیا',")
          text = text.replace("const wikipedia = computed(() => partyWikipediaLinks(props.partyCode))", "const wikipedia = computed(() => partyWikipediaLinks(props.partyCode))\nconst wikipediaHref = computed(() => {\n  const links = wikipedia.value\n  if (language.value === 'fa') return links.fa || links.en || links.fi || ''\n  if (language.value === 'fi') return links.fi || links.en || links.fa || ''\n  return links.en || links.fi || links.fa || ''\n})")
          old_links = '''        <div class="party-page__links">\n          <a v-if="wikipedia.fa" :href="wikipedia.fa" target="_blank" rel="noreferrer">\n            {{ t('persianWikipedia') }}\n          </a>\n          <a v-if="wikipedia.fi" :href="wikipedia.fi" target="_blank" rel="noreferrer">\n            {{ t('finnishWikipedia') }}\n          </a>\n        </div>\n'''
          text = text.replace(old_links, '')
          marker = '        <p class="party-profile-box__basis">{{ t(\'partyProfileBasis\') }}</p>\n'
          addition = marker + '''        <div v-if="wikipediaHref" class="party-page__links">\n          <a :href="wikipediaHref" target="_blank" rel="noreferrer">{{ text.wikipedia }}</a>\n        </div>\n'''
          text = text.replace(marker, addition)
          party.write_text(text)

          # 3) Add the same POI control to postal detail pages, filtered to the selected postal polygon.
          postal = Path('src/components/postal/PostalCodeDetail.vue')
          text = postal.read_text()
          text = text.replace("import L, { type Map, type Polygon } from 'leaflet'", "import L, { type FeatureGroup, type Map, type Polygon } from 'leaflet'")
          text = text.replace("import { TILE_LAYER, VAASA_CENTER } from '@/config/map'", "import { TILE_LAYER, VAASA_CENTER } from '@/config/map'\nimport { POI_CATEGORY_GROUPS, poiCategoryDefinition } from '@/config/pois'")
          text = text.replace("import type { AreaBoundary, PienalueBoundary } from '@/domain/areas'", "import type { AreaBoundary, PienalueBoundary } from '@/domain/areas'\nimport { POI_CATEGORIES, type PoiCategory, type PoiFeature } from '@/domain/pois'")
          text = text.replace("import { localizeAreaName, useI18n } from '@/i18n'", "import { localizeAreaName, useI18n } from '@/i18n'\nimport { poiText, type PoiMessageKey } from '@/poiI18n'")
          text = text.replace("import { postalIntersectsBoundary, postalRingsForLeaflet } from '@/services/postalGeometry'", "import { fetchPoiFeatureCollection } from '@/services/poiData'\nimport { addPoiFeatureGroup } from '@/services/poiMap'\nimport { postalContainsPoint, postalIntersectsBoundary, postalRingsForLeaflet } from '@/services/postalGeometry'")
          text = text.replace("const error = ref('')", "const error = ref('')\nconst allPoiFeatures = ref<PoiFeature[]>([])\nconst activePoiCategories = ref<PoiCategory[]>([])\nconst poiLoading = ref(true)\nconst poiFailed = ref(false)\nconst poiSourceUrl = ref('https://www.openstreetmap.org/copyright')")
          text = text.replace("let polygon: Polygon | null = null", "let polygon: Polygon | null = null\nlet poiGroup: FeatureGroup | null = null")
          marker = "const title = computed(() => {"
          computed_block = '''const postalPoiFeatures = computed(() => {\n  if (!postal.value) return []\n  return allPoiFeatures.value.filter((feature) => {\n    const [lon, lat] = feature.geometry.coordinates\n    return postalContainsPoint(postal.value!, lat, lon)\n  })\n})\nconst visiblePoiFeatures = computed(() =>\n  postalPoiFeatures.value.filter((feature) =>\n    activePoiCategories.value.includes(feature.properties.category),\n  ),\n)\nconst numberFormatter = computed(\n  () => new Intl.NumberFormat(language.value === 'fa' ? 'fa-IR' : 'en-FI'),\n)\nconst poiStatus = computed(() => {\n  if (poiLoading.value) return poiLabel('loading')\n  if (poiFailed.value) return poiLabel('unavailable')\n  return `${poiLabel('placesShown')}: ${numberFormatter.value.format(visiblePoiFeatures.value.length)}/${numberFormatter.value.format(postalPoiFeatures.value.length)}`\n})\n\n'''
          text = text.replace(marker, computed_block + marker)
          marker = "function majorName(area: AreaBoundary): string {"
          funcs = '''function poiLabel(key: PoiMessageKey): string {\n  return poiText(language.value, key)\n}\n\nfunction poiCategoryCount(category: PoiCategory): number {\n  return postalPoiFeatures.value.filter((feature) => feature.properties.category === category).length\n}\n\nfunction isPoiCategoryActive(category: PoiCategory): boolean {\n  return activePoiCategories.value.includes(category)\n}\n\nfunction renderPoiLayers(): void {\n  if (!map) return\n  poiGroup?.remove()\n  poiGroup = addPoiFeatureGroup(map, visiblePoiFeatures.value, language.value)\n}\n\nfunction togglePoiCategory(category: PoiCategory): void {\n  activePoiCategories.value = isPoiCategoryActive(category)\n    ? activePoiCategories.value.filter((value) => value !== category)\n    : [...activePoiCategories.value, category]\n  renderPoiLayers()\n}\n\nfunction showAllPois(): void {\n  activePoiCategories.value = [...POI_CATEGORIES]\n  renderPoiLayers()\n}\n\nfunction hideAllPois(): void {\n  activePoiCategories.value = []\n  renderPoiLayers()\n}\n\nfunction fitAreaOnMap(): void {\n  if (!map || !polygon) return\n  const bounds = polygon.getBounds()\n  if (bounds.isValid()) map.fitBounds(bounds, { padding: [28, 28] })\n}\n\nfunction fitAllPoisOnMap(): void {\n  if (!map || !poiGroup) return\n  const bounds = poiGroup.getBounds()\n  if (bounds.isValid()) map.fitBounds(bounds, { padding: [28, 28] })\n}\n\nasync function loadPois(): Promise<void> {\n  poiLoading.value = true\n  poiFailed.value = false\n  try {\n    const poiCollection = await fetchPoiFeatureCollection()\n    allPoiFeatures.value = poiCollection.features\n    poiSourceUrl.value = poiCollection.source?.url || poiSourceUrl.value\n    renderPoiLayers()\n  } catch {\n    poiFailed.value = true\n  } finally {\n    poiLoading.value = false\n  }\n}\n\n'''
          text = text.replace(marker, funcs + marker)
          text = text.replace("  L.tileLayer(TILE_LAYER.url, TILE_LAYER.options).addTo(map)\n  try {", "  L.tileLayer(TILE_LAYER.url, TILE_LAYER.options).addTo(map)\n  void loadPois()\n  try {")
          text = text.replace("    if (bounds.isValid()) map.fitBounds(bounds, { padding: [28, 28] })", "    if (bounds.isValid()) map.fitBounds(bounds, { padding: [28, 28] })\n    renderPoiLayers()")
          text = text.replace("onBeforeUnmount(() => {\n  polygon?.remove()", "onBeforeUnmount(() => {\n  poiGroup?.remove()\n  poiGroup = null\n  polygon?.remove()")
          map_marker = '''          <div\n            ref="mapElement"\n            class="map-canvas area-detail-map"\n            role="region"\n            :aria-label="title"\n          />'''
          poi_control = '''          <details class="poi-control poi-control--area" :aria-label="poiLabel('places')">\n            <summary class="poi-control__summary">\n              <span class="poi-control__title">\n                <strong>{{ poiLabel('places') }}</strong>\n                <small>{{ poiLabel('allAreasHint') }}</small>\n              </span>\n            </summary>\n\n            <div class="poi-control__body">\n              <div class="poi-control__actions">\n                <button type="button" @click="fitAreaOnMap">{{ poiLabel('focusArea') }}</button>\n                <button\n                  type="button"\n                  :disabled="poiLoading || poiFailed || visiblePoiFeatures.length === 0"\n                  @click="fitAllPoisOnMap"\n                >\n                  {{ poiLabel('showAllVaasa') }}\n                </button>\n                <button type="button" @click="showAllPois">{{ poiLabel('showAll') }}</button>\n                <button type="button" @click="hideAllPois">{{ poiLabel('hideAll') }}</button>\n              </div>\n\n              <div class="poi-control__groups">\n                <section\n                  v-for="group in POI_CATEGORY_GROUPS"\n                  :key="group.id"\n                  class="poi-control__group"\n                >\n                  <h3>{{ group.labels[language] }}</h3>\n                  <div class="poi-control__categories">\n                    <button\n                      v-for="category in group.categories"\n                      :key="category"\n                      type="button"\n                      :class="[\n                        'poi-control__category',\n                        { 'is-active': isPoiCategoryActive(category) },\n                      ]"\n                      :aria-pressed="isPoiCategoryActive(category)"\n                      @click="togglePoiCategory(category)"\n                    >\n                      <i\n                        :style="{ backgroundColor: poiCategoryDefinition(category).color }"\n                        aria-hidden="true"\n                      />\n                      {{ poiCategoryDefinition(category).labels[language] }}\n                      <span>{{ numberFormatter.format(poiCategoryCount(category)) }}</span>\n                    </button>\n                  </div>\n                </section>\n              </div>\n\n              <div class="poi-control__footer">\n                <span class="poi-control__status" role="status">{{ poiStatus }}</span>\n                <a\n                  class="poi-control__source"\n                  :href="poiSourceUrl"\n                  target="_blank"\n                  rel="noreferrer"\n                >\n                  {{ poiLabel('source') }}\n                </a>\n              </div>\n            </div>\n          </details>\n\n''' + map_marker
          text = text.replace(map_marker, poi_control)
          postal.write_text(text)
          PY
          npm install --no-audit --no-fund
          npx prettier --write src/App.vue src/components/analysis/PartyAnalysisPage.vue src/components/postal/PostalCodeDetail.vue src/services/electionStatistics.ts src/services/electionStatistics.spec.ts
          npm run lint -- --fix
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.vue src/components/analysis/PartyAnalysisPage.vue src/components/postal/PostalCodeDetail.vue src/services/electionStatistics.ts src/services/electionStatistics.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply small UI followups"
          git push origin HEAD:agent/small-ui-followups
