name: Generate Paavo snapshot

on:
  push:
    branches: [agent/paavo-local-snapshot]

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/paavo-local-snapshot
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate Vaasa boundaries
        run: node scripts/update-osm-boundaries.mjs
      - name: Generate Paavo snapshots
        run: node scripts/update-paavo-postal-data.mjs
      - name: Commit generated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/paavo-postal-areas.geojson public/data/paavo-postal-history.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Store Paavo postal snapshots"
          git push origin HEAD:agent/paavo-local-snapshot
