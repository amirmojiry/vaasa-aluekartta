name: Fix analysis lint

on:
  push:
    branches:
      - agent/thematic-analysis-pages

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/thematic-analysis-pages
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply semantic markup fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')

          function replaceRegex(source, regex, replacement, expected, label) {
            const matches = source.match(regex) ?? []
            if (matches.length !== expected) {
              throw new Error(`${label}: expected ${expected} match(es), got ${matches.length}`)
            }
            return source.replace(regex, replacement)
          }

          const incomePath = 'src/components/areas/AreaIncomeSummary.vue'
          let income = fs.readFileSync(incomePath, 'utf8')
          income = replaceRegex(
            income,
            /      <strong\s*>\s*<a class="income-summary__analysis-link" :href="incomePageHref">\{\{\s*text\.title\s*\}\}<\/a><\/strong\s*>/g,
            `      <a
                class="income-summary__analysis-link income-summary__analysis-link--heading"
                :href="incomePageHref"
              >
                {{ text.title }}
              </a>`,
            2,
            'income headings',
          )
          if (!income.includes('.income-summary__analysis-link--heading')) {
            income = income.replace(
              `.income-summary__rank-link {\n  color: #65736f;\n  font-weight: 750;\n}`,
              `.income-summary__analysis-link--heading {\n  font-weight: 800;\n}\n\n.income-summary__rank-link {\n  color: #65736f;\n  font-weight: 750;\n}`,
            )
          }
          fs.writeFileSync(incomePath, income)

          const cityPath = 'src/components/areas/CityStatisticsSummary.vue'
          let city = fs.readFileSync(cityPath, 'utf8')
          city = replaceRegex(
            city,
            /        <strong\s*>\s*<a class="summary-analysis-link" :href="metricHref\('students'\)">\{\{\s*t\('students'\)\s*\}\}<\/a><\/strong\s*>/g,
            `        <a
                  class="summary-analysis-link summary-analysis-link--heading"
                  :href="metricHref('students')"
                >
                  {{ t('students') }}
                </a>`,
            1,
            'student heading',
          )
          city = replaceRegex(
            city,
            /      <span\s*>\s*<a class="summary-analysis-link" :href="metricHref\('population'\)">\{\{\s*t\('population'\)\s*\}\}<\/a>\s*·\s*\{\{\s*yearFormatter\.format\(statistics\.populationYear\)\s*\}\}<\/span\s*>/g,
            `      <span class="summary-population__label">
                <a class="summary-analysis-link" :href="metricHref('population')">{{ t('population') }}</a>
                <span aria-hidden="true">·</span>
                {{ yearFormatter.format(statistics.populationYear) }}
              </span>`,
            1,
            'population label',
          )
          city = replaceRegex(
            city,
            /        <strong\s*>\s*<a class="summary-analysis-link" :href="metricHref\('income'\)">\{\{\s*incomeLabel\s*\}\}<\/a><\/strong\s*>/g,
            `        <a
                  class="summary-analysis-link summary-analysis-link--heading"
                  :href="metricHref('income')"
                >
                  {{ incomeLabel }}
                </a>`,
            1,
            'income heading',
          )
          city = replaceRegex(
            city,
            /      <a\s+v-if="incomeSourceUrl"\s+class="city-income-summary__source"\s+:href="incomeSourceUrl"\s+target="_blank"\s+rel="noreferrer"\s*>\s*\{\{\s*incomeSourceLabel\s*\}\} · Statistics Finland 2014b \/ Sanna Komsi \(2016\)<\/a\s*>/g,
            `      <a
                v-if="incomeSourceUrl"
                class="city-income-summary__source"
                :href="incomeSourceUrl"
                target="_blank"
                rel="noreferrer"
              >
                {{ incomeSourceLabel }} · Statistics Finland 2014b / Sanna Komsi (2016)
              </a>`,
            1,
            'income source',
          )
          city = replaceRegex(
            city,
            /            <a class="summary-analysis-link" :href="partyHref\(party\.party\)"\s*>\s*\{\{\s*party\.party\s*\}\} · \{\{\s*partyName\(party\.party\)\s*\}\}<\/a\s*>/g,
            `            <a class="summary-analysis-link" :href="partyHref(party.party)">
                      {{ party.party }} · {{ partyName(party.party) }}
                    </a>`,
            1,
            'party link',
          )
          if (!city.includes('.summary-analysis-link--heading')) {
            city = city.replace(
              `.summary-analysis-link {\n  color: inherit;\n  font-weight: inherit;\n  text-underline-offset: 0.16rem;\n}`,
              `.summary-analysis-link {\n  color: inherit;\n  font-weight: inherit;\n  text-underline-offset: 0.16rem;\n}\n\n.summary-analysis-link--heading {\n  font-weight: 800;\n}`,
            )
          }
          fs.writeFileSync(cityPath, city)

          const partyPath = 'src/components/analysis/PartyAnalysisPage.vue'
          let party = fs.readFileSync(partyPath, 'utf8')
          party = party.replace(
            `return value.fa || value.en || value.fi\n`,
            `return value.fa || value.en || value.fi || ''\n`,
          )
          party = party.replace(
            `return value.fi || value.en || value.fa\n`,
            `return value.fi || value.en || value.fa || ''\n`,
          )
          party = party.replace(
            `return value.en || value.fi || value.fa\n`,
            `return value.en || value.fi || value.fa || ''\n`,
          )
          fs.writeFileSync(partyPath, party)
          NODE

      - name: Format changed files
        run: npx prettier --write src/components/areas/AreaIncomeSummary.vue src/components/areas/CityStatisticsSummary.vue src/components/analysis/PartyAnalysisPage.vue

      - name: Validate
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/areas/AreaIncomeSummary.vue src/components/areas/CityStatisticsSummary.vue src/components/analysis/PartyAnalysisPage.vue
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix analysis markup and validation"
          git push origin HEAD:agent/thematic-analysis-pages
