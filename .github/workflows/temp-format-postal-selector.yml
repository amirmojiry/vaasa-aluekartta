name: Temporary format postal selector

on:
  push:
    branches:
      - agent/paavo-local-snapshot
    paths:
      - .github/workflows/temp-format-postal-selector.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/paavo-local-snapshot
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write src/components/postal/PostalAreaSelector.vue
      - name: Commit formatter output
        run: |
          if git diff --quiet -- src/components/postal/PostalAreaSelector.vue; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/postal/PostalAreaSelector.vue
          git commit -m "Format postal area selector"
          git push origin HEAD:agent/paavo-local-snapshot
