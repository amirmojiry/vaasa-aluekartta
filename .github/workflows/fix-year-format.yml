name: Fix year formatting

on:
  push:
    branches:
      - agent/fix-year-format

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-year-format
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Restore year column and disable grouping
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'src/components/analysis/MetricAnalysisPage.vue'
          let source = fs.readFileSync(path, 'utf8')

          const labels = [
            ["    value: 'Value',\n", "    value: 'Value',\n    year: 'Year',\n"],
            ["    value: 'Arvo',\n", "    value: 'Arvo',\n    year: 'Vuosi',\n"],
            ["    value: 'مقدار',\n", "    value: 'مقدار',\n    year: 'سال',\n"],
          ]
          for (const [from, to] of labels) {
            if (!source.includes(from)) throw new Error(`Missing label anchor: ${from.trim()}`)
            source = source.replace(from, to)
          }

          const formatterAnchor = "const numberFormatter = computed(() => new Intl.NumberFormat(localeForLanguage(language.value)))\n"
          if (!source.includes(formatterAnchor)) throw new Error('Missing number formatter anchor')
          source = source.replace(
            formatterAnchor,
            `${formatterAnchor}const yearFormatter = computed(\n  () => new Intl.NumberFormat(localeForLanguage(language.value), { useGrouping: false }),\n)\n`,
          )

          const header = `                  <th>{{ text.rank }}</th>\n                  <th>{{ text.area }}</th>\n                  <th>{{ text.value }}</th>`
          if (!source.includes(header)) throw new Error('Missing compact table header')
          source = source.replace(
            header,
            `${header}\n                  <th>{{ text.year }}</th>`,
          )

          const cell = `                  <td>{{ formatValue(item.value) }} · {{ numberFormatter.format(item.year) }}</td>`
          if (!source.includes(cell)) throw new Error('Missing inline year cell')
          source = source.replace(
            cell,
            `                  <td>{{ formatValue(item.value) }}</td>\n                  <td>{{ yearFormatter.format(item.year) }}</td>`,
          )

          fs.writeFileSync(path, source)
          NODE

      - name: Format changed file
        run: npx prettier --write src/components/analysis/MetricAnalysisPage.vue

      - name: Validate
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/analysis/MetricAnalysisPage.vue
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Format years without grouping"
          git push origin HEAD:agent/fix-year-format
