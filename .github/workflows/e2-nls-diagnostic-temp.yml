name: Temporary E2 NLS candidate diagnostic

on:
  push:
    branches: [agent/events-e2-location-resolution]

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[diag-e2-nls]')
    runs-on: ubuntu-latest
    env:
      NLS_API_KEY: ${{ secrets.NLS_API_KEY }}
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/events-e2-location-resolution
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect representative ambiguous candidates
        run: |
          node --input-type=module <<'NODE'
          import { buildNlsSearchUrl } from './scripts/lib/nls-geocoder.mjs'

          const queries = [
            'Långviksgatan 20',
            'Ajurinkatu 14, 65100 Vaasa',
            'Gerbyntie 16, 65230 Vaasa',
            'Kirkkopuistikko 31, 65100 Vaasa, Suomi',
            'Porinmäenkuja 1, 66500 Vaasa',
          ]

          for (const query of queries) {
            const response = await fetch(buildNlsSearchUrl(query), {
              headers: {
                Accept: 'application/geo+json, application/json',
                Authorization: `Basic ${Buffer.from(`${process.env.NLS_API_KEY}:`).toString('base64')}`,
              },
            })
            const body = await response.json()
            const candidates = (body.features ?? []).map((feature) => {
              const p = feature.properties ?? {}
              return {
                coordinates: feature.geometry?.coordinates,
                source: p.source,
                layer: p.layer,
                label: p.label,
                name: p.name,
                confidence: p.confidence,
                accuracy: p.accuracy,
                street: p.street,
                housenumber: p.housenumber,
                postalcode: p.postalcode,
                locality: p.locality,
                municipality: p.municipality,
                gid: p.gid,
                id: p.id,
              }
            })
            console.log(JSON.stringify({ query, status: response.status, candidates }, null, 2))
          }
          NODE
