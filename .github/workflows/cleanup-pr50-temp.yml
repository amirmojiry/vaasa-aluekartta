name: Cleanup PR 50 temp workflow

on:
  push:
    branches:
      - agent/document-events-jobs-roadmap

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/document-events-jobs-roadmap

      - name: Remove temporary workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-pr50-review-fixes.yml .github/workflows/cleanup-pr50-temp.yml
          git commit -m 'Remove temporary review-fix workflows'
          git push origin HEAD:agent/document-events-jobs-roadmap
