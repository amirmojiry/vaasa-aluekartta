name: Temporary format small UI followups

on:
  push:
    branches:
      - agent/small-ui-followups
    paths:
      - .github/workflows/temp-format-small-ui.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/small-ui-followups
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Keep Wikipedia link in the active language only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/analysis/PartyAnalysisPage.vue')
          text = path.read_text()
          old = """const wikipediaHref = computed(() => {\n  const links = wikipedia.value\n  if (language.value === 'fa') return links.fa || links.en || links.fi || ''\n  if (language.value === 'fi') return links.fi || links.en || links.fa || ''\n  return links.en || links.fi || links.fa || ''\n})"""
          new = """const wikipediaHref = computed(() => {\n  const links = wikipedia.value\n  if (language.value === 'fa') return links.fa ?? ''\n  if (language.value === 'fi') return links.fi ?? ''\n  return links.en ?? ''\n})"""
          if old not in text:
              raise SystemExit('Expected Wikipedia fallback block was not found')
          path.write_text(text.replace(old, new))
          PY
      - run: npx prettier --write src/components/postal/PostalCodeDetail.vue src/components/analysis/PartyAnalysisPage.vue
      - name: Commit formatter output
        run: |
          if git diff --quiet -- src/components/postal/PostalCodeDetail.vue src/components/analysis/PartyAnalysisPage.vue; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/postal/PostalCodeDetail.vue src/components/analysis/PartyAnalysisPage.vue
          git commit -m "Format small UI followups"
          git push origin HEAD:agent/small-ui-followups
