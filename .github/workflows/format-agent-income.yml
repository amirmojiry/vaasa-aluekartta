name: Format income changes

on:
  push:
    branches: [agent/add-area-income]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-area-income
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Format changed files
        run: npx prettier --write public/data/area-income-2014.json scripts/validate-area-income.mjs src/components/areas/AreaIncomeSummary.vue
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/area-income-2014.json scripts/validate-area-income.mjs src/components/areas/AreaIncomeSummary.vue
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format income changes"
          git push origin HEAD:agent/add-area-income
