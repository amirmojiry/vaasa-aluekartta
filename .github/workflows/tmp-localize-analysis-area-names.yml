name: Localize analysis area names

on:
  push:
    branches:
      - agent/localize-analysis-area-names

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/localize-analysis-area-names
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply requested fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')

          function replaceOnce(source, from, to, label) {
            if (source.includes(to)) return source
            if (!source.includes(from)) throw new Error(`Missing ${label}`)
            return source.replace(from, to)
          }

          {
            const path = 'src/i18n.ts'
            let source = fs.readFileSync(path, 'utf8')
            source = replaceOnce(
              source,
              "studentsShare: 'Students (share of labour force)'",
              "studentsShare: 'Students (relative to labour-force size)'",
              'English student denominator label',
            )
            source = replaceOnce(
              source,
              "studentsShare: 'Opiskelijat (osuus työvoimasta)'",
              "studentsShare: 'Opiskelijat (suhteessa työvoiman määrään)'",
              'Finnish student denominator label',
            )
            source = replaceOnce(
              source,
              "studentsShare: 'دانشجویان (سهم از نیروی کار)'",
              "studentsShare: 'دانشجویان (نسبت به اندازه نیروی کار)'",
              'Persian student denominator label',
            )
            fs.writeFileSync(path, source)
          }

          {
            const path = 'src/components/analysis/MetricAnalysisPage.vue'
            let source = fs.readFileSync(path, 'utf8')
            source = replaceOnce(
              source,
              "import type { AreaLevel } from '@/domain/areas'",
              "import type { AreaLevel, LocalizedAreaNames } from '@/domain/areas'",
              'metric area type import',
            )
            source = replaceOnce(
              source,
              "import { localeForLanguage, useI18n } from '@/i18n'",
              "import { localeForLanguage, localizeAreaName, useI18n } from '@/i18n'",
              'metric i18n import',
            )
            source = replaceOnce(
              source,
              "const minorAreaRelationIds = ref(new Map<string, number>())",
              "const minorAreaRelationIds = ref(new Map<string, number>())\nconst minorAreaNames = ref(new Map<string, LocalizedAreaNames>())",
              'metric minor area names state',
            )
            source = replaceOnce(
              source,
              "    students: 'Students by area',",
              "    students: 'Students relative to labour-force size by area',",
              'metric English students title',
            )
            source = replaceOnce(
              source,
              "    students: 'Opiskelijat alueittain',",
              "    students: 'Opiskelijat suhteessa työvoiman määrään alueittain',",
              'metric Finnish students title',
            )
            source = replaceOnce(
              source,
              "    students: 'دانشجویان در مناطق',",
              "    students: 'دانشجویان نسبت به اندازه نیروی کار در مناطق',",
              'metric Persian students title',
            )
            source = replaceOnce(
              source,
              "function areaHref(name: string): string | null {",
              "function displayAreaName(name: string): string {\n  const names = level.value === 'pienalue' ? minorAreaNames.value.get(name) : undefined\n  return localizeAreaName(names, name, language.value)\n}\n\nfunction areaHref(name: string): string | null {",
              'metric display area name helper',
            )
            source = replaceOnce(
              source,
              "      minorAreaRelationIds.value = new Map(\n        minorBoundaries.map((boundary) => [boundary.name, boundary.relationId]),\n      )",
              "      minorAreaRelationIds.value = new Map(\n        minorBoundaries.map((boundary) => [boundary.name, boundary.relationId]),\n      )\n      minorAreaNames.value = new Map(\n        minorBoundaries.map((boundary) => [boundary.name, boundary.names]),\n      )",
              'metric minor area names load',
            )
            source = source.replaceAll('{{ item.name }}', '{{ displayAreaName(item.name) }}')
            fs.writeFileSync(path, source)
          }

          {
            const path = 'src/components/analysis/PartyAnalysisPage.vue'
            let source = fs.readFileSync(path, 'utf8')
            source = replaceOnce(
              source,
              "import type { AreaLevel, LocalizedText } from '@/domain/areas'",
              "import type { AreaLevel, LocalizedAreaNames, LocalizedText } from '@/domain/areas'",
              'party area type import',
            )
            source = replaceOnce(
              source,
              "import { localeForLanguage, localizeText, useI18n } from '@/i18n'",
              "import { localeForLanguage, localizeAreaName, localizeText, useI18n } from '@/i18n'",
              'party i18n import',
            )
            source = replaceOnce(
              source,
              "const minorAreaRelationIds = ref(new Map<string, number>())",
              "const minorAreaRelationIds = ref(new Map<string, number>())\nconst minorAreaNames = ref(new Map<string, LocalizedAreaNames>())",
              'party minor area names state',
            )
            source = replaceOnce(
              source,
              "function areaHref(name: string): string | null {",
              "function displayAreaName(name: string): string {\n  const names = level.value === 'pienalue' ? minorAreaNames.value.get(name) : undefined\n  return localizeAreaName(names, name, language.value)\n}\n\nfunction areaHref(name: string): string | null {",
              'party display area name helper',
            )
            source = replaceOnce(
              source,
              "    minorAreaRelationIds.value = new Map(\n      minorBoundaries.map((boundary) => [boundary.name, boundary.relationId]),\n    )",
              "    minorAreaRelationIds.value = new Map(\n      minorBoundaries.map((boundary) => [boundary.name, boundary.relationId]),\n    )\n    minorAreaNames.value = new Map(\n      minorBoundaries.map((boundary) => [boundary.name, boundary.names]),\n    )",
              'party minor area names load',
            )
            source = source.replaceAll('{{ item.name }}', '{{ displayAreaName(item.name) }}')
            fs.writeFileSync(path, source)
          }
          NODE

      - name: Format changed files
        run: npx prettier --write src/i18n.ts src/components/analysis/MetricAnalysisPage.vue src/components/analysis/PartyAnalysisPage.vue

      - name: Validate
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i18n.ts src/components/analysis/MetricAnalysisPage.vue src/components/analysis/PartyAnalysisPage.vue
          git commit -m "Localize analysis area names"
          git push
