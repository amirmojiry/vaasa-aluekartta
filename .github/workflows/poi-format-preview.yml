name: POI format preview

on:
  push:
    branches: [agent/map-pois]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Format POI files
        run: npx prettier --write scripts/update-osm-pois.mjs src/components/map/VaasaMap.vue src/services/poiData.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update-osm-pois.mjs src/components/map/VaasaMap.vue src/services/poiData.ts
          git commit -m "chore: format POI implementation"
          git push
