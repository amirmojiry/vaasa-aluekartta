name: Temporary E2 formatter

on:
  push:
    branches: [agent/events-e2-location-resolution]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[format-e2]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/events-e2-location-resolution
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format remaining E2 files
        run: npx prettier --write docs/event-location-resolution.md scripts/validate-event-locations.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/event-location-resolution.md scripts/validate-event-locations.mjs
          if git diff --cached --quiet; then
            echo "E2 files already formatted"
            exit 0
          fi
          git commit -m "Format E2 proof files"
          git push origin HEAD:agent/events-e2-location-resolution
