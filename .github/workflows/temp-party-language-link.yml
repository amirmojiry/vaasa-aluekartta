name: Temporary party language link fix

on:
  push:
    branches:
      - agent/small-ui-followups
    paths:
      - .github/workflows/temp-party-language-link.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/small-ui-followups
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Match Wikipedia link strictly to UI language
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/analysis/PartyAnalysisPage.vue')
          text = path.read_text()
          old = """const wikipediaHref = computed(() => {\n  const links = wikipedia.value\n  if (language.value === 'fa') return links.fa || links.en || links.fi || ''\n  if (language.value === 'fi') return links.fi || links.en || links.fa || ''\n  return links.en || links.fi || links.fa || ''\n})"""
          new = """const wikipediaHref = computed(() => {\n  const links = wikipedia.value\n  if (language.value === 'fa') return links.fa ?? ''\n  if (language.value === 'fi') return links.fi ?? ''\n  return links.en ?? ''\n})"""
          if old in text:
              path.write_text(text.replace(old, new))
          elif new not in text:
              raise SystemExit('Wikipedia language selection block not found')
          PY
      - run: npx prettier --write src/components/analysis/PartyAnalysisPage.vue
      - name: Commit and push
        run: |
          if git diff --quiet -- src/components/analysis/PartyAnalysisPage.vue; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/analysis/PartyAnalysisPage.vue
          git commit -m "Match party Wikipedia link to UI language"
          git pull --rebase origin agent/small-ui-followups
          git push origin HEAD:agent/small-ui-followups
