name: Run roadmap quality patch

on:
  push:
    branches:
      - agent/complete-roadmap-quality

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/complete-roadmap-quality
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 scripts/tmp_apply_roadmap_quality.py
      - name: Install Playwright dependency
        run: |
          npm pkg set version=1.0.0
          npm pkg set scripts.test:e2e="playwright test"
          npm pkg set scripts.performance:check="node scripts/audit-performance.mjs"
          npm install --save-dev @playwright/test --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Format
        run: npm run format
      - name: Refresh boundary data
        run: npm run data:update
      - name: Validate
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run performance:check -- --write-report
          npm run test:e2e
          npm run format:check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md package.json package-lock.json playwright.config.ts e2e/core-journeys.spec.ts scripts/audit-performance.mjs docs/performance-audit.md src/components/map/VaasaMap.vue src/styles/main.css .github/workflows/ci.yml .github/workflows/deploy-pages.yml
          git commit -m "Complete roadmap quality milestone"
          git push origin HEAD:agent/complete-roadmap-quality
