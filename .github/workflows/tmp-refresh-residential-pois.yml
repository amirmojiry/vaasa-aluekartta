name: Temporary residential POI refresh

on:
  push:
    branches:
      - agent/residential-pois-area-filters

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'Refresh residential POI snapshot'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/residential-pois-area-filters

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Format source
        run: npm run format

      - name: Refresh POI snapshot
        run: npm run pois:update

      - name: Validate snapshot
        run: npm run pois:check

      - name: Commit generated snapshot and formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Refresh residential POI snapshot"
          git push origin HEAD:agent/residential-pois-area-filters
