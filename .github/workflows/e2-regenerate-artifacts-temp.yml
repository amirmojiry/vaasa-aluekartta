name: Temporary E2 artifact regeneration

on:
  push:
    branches: [agent/events-e2-location-resolution]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/events-e2-location-resolution
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Regenerate local-only E2 artifacts
        run: npm run events:locations
      - name: Commit synchronized artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/location-cache.json public/data/event-locations.json public/data/event-location-report.json
          if git diff --cached --quiet; then
            echo "E2 artifacts already match current resolver"
            exit 0
          fi
          git commit -m "Regenerate E2 location proof artifacts"
          git push origin HEAD:agent/events-e2-location-resolution
