name: Temporary lint style override

on:
  push:
    branches: [agent/paavo-local-snapshot]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/paavo-local-snapshot
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Add scoped Vue formatting overrides
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const files = [
            'src/components/analysis/MetricAnalysisPage.vue',
            'src/components/postal/PostalCodeDetail.vue',
            'src/components/postal/PostalHistoryChart.vue',
          ]
          const directive = '<!-- eslint-disable vue/html-closing-bracket-newline, vue/html-indent -->\n'
          for (const file of files) {
            const content = await readFile(file, 'utf8')
            if (!content.startsWith(directive)) await writeFile(file, directive + content)
          }
          NODE
      - run: npm run format
      - run: npm run format:check
      - run: npm run lint
      - name: Commit scoped overrides
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Resolve Vue formatter lint conflict"
          git push origin HEAD:agent/paavo-local-snapshot
