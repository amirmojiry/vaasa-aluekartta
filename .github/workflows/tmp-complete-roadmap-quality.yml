async function mockMapData(page: Page): Promise<void> {
  await page.route('**/data/vaasa-suuralueet.geojson', (route) =>
    route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(majorBoundary) }),
  )
  await page.route('**/data/vaasa-pienalueet.geojson', (route) =>
    route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(minorBoundary) }),
  )
  await page.route(/https:\/\/[abc]\.tile\.openstreetmap\.org\/.*/, (route) => route.abort())
  await page.route(/https:\/\/fonts\.(googleapis|gstatic)\.com\/.*/, (route) => route.abort())
}

test.beforeEach(async ({ page }) => {
  await mockMapData(page)
})

test('loads from the GitHub Pages base path and preserves boundary level in browser history', async ({
  page,
}) => {
  await page.goto('/vaasa-aluekartta/?lang=en')
  await expect(page.getByRole('heading', { name: 'Statistical areas' })).toBeVisible()

  const minorButton = page.getByRole('button', { name: /Minor areas/ })
  await minorButton.click()
  await expect(minorButton).toHaveAttribute('aria-pressed', 'true')
  await expect(page).toHaveURL(/level=pienalue/)

  await page.goBack()
  await expect(page.getByRole('button', { name: /Major areas/ })).toHaveAttribute(
    'aria-pressed',
    'true',
  )
})

test('finds an address without map interaction and opens its minor-area page', async ({ page }) => {
  await page.route('https://nominatim.openstreetmap.org/search**', (route) =>
    route.fulfill({
      status: 200,
      contentType: 'application/json',
      body: JSON.stringify([
        { display_name: 'Test address, Vaasa', lat: '63.095', lon: '21.620' },
      ]),
    }),
  )

  await page.goto('/vaasa-aluekartta/?lang=en')
  await page.getByLabel('Search address').fill('Test address')
  await page.getByRole('button', { name: 'Search' }).click()

  await expect(page).toHaveURL(/pienalue=11930883/)
  await expect(page.getByRole('heading', { level: 1 })).toContainText('City centre 1')
})

test('restores a shared major-area URL', async ({ page }) => {
  await page.goto('/vaasa-aluekartta/?area=keskusta&lang=en')
  await expect(page).toHaveURL(/area=keskusta/)
  await expect(page.getByRole('heading', { level: 1 })).toContainText('City centre')
})

test('keeps the primary journey usable at a mobile viewport', async ({ page }) => {
  await page.setViewportSize({ width: 390, height: 844 })
  await page.goto('/vaasa-aluekartta/?lang=en')

  const searchButton = page.getByRole('button', { name: 'Search' })
  const minorButton = page.getByRole('button', { name: /Minor areas/ })
  const searchBox = await searchButton.boundingBox()
  const minorBox = await minorButton.boundingBox()

  expect(searchBox?.height ?? 0).toBeGreaterThanOrEqual(44)
  expect(minorBox?.height ?? 0).toBeGreaterThanOrEqual(44)
  expect(
    await page.evaluate(() => document.documentElement.scrollWidth <= window.innerWidth + 1),
  ).toBe(true)

  await minorButton.click()
  await expect(page).toHaveURL(/level=pienalue/)
})
""")

          Path('scripts/audit-performance.mjs').write_text(r"""import { readdir, stat, writeFile } from 'node:fs/promises'
import path from 'node:path'

const KiB = 1024
const MiB = 1024 * KiB
const budgets = {
  javascript: 800 * KiB,
  css: 250 * KiB,
  largestData: 5 * MiB,
  dataTotal: 12 * MiB,
  distTotal: 15 * MiB,
}

async function filesUnder(root) {
  const entries = await readdir(root, { withFileTypes: true })
  const files = []
  for (const entry of entries) {
    const absolute = path.join(root, entry.name)
    if (entry.isDirectory()) files.push(...(await filesUnder(absolute)))
    else if (entry.isFile()) files.push({ path: absolute, size: (await stat(absolute)).size })
  }
  return files
}

function bytes(value) {
  if (value >= MiB) return `${(value / MiB).toFixed(2)} MiB`
  return `${(value / KiB).toFixed(1)} KiB`
}

const files = await filesUnder('dist')
const js = files.filter((file) => file.path.endsWith('.js')).reduce((sum, file) => sum + file.size, 0)
const css = files.filter((file) => file.path.endsWith('.css')).reduce((sum, file) => sum + file.size, 0)
const dataFiles = files.filter((file) => file.path.includes(`${path.sep}data${path.sep}`))
const dataTotal = dataFiles.reduce((sum, file) => sum + file.size, 0)
const largestData = dataFiles.reduce((largest, file) => (file.size > largest.size ? file : largest), {
  path: 'none',
  size: 0,
})
const distTotal = files.reduce((sum, file) => sum + file.size, 0)

const rows = [
  ['JavaScript', js, budgets.javascript],
  ['CSS', css, budgets.css],
  ['Largest data file', largestData.size, budgets.largestData],
  ['All data files', dataTotal, budgets.dataTotal],
  ['Full dist', distTotal, budgets.distTotal],
]

console.log('Performance and map-data audit')
for (const [label, value, budget] of rows) {
  console.log(`${label}: ${bytes(value)} / budget ${bytes(budget)}`)
}
console.log(`Largest data file: ${largestData.path}`)

const violations = rows.filter(([, value, budget]) => value > budget)
if (violations.length) {
  for (const [label, value, budget] of violations) {
    console.error(`${label} exceeds budget: ${bytes(value)} > ${bytes(budget)}`)
  }
  process.exitCode = 1
}

if (process.argv.includes('--write-report')) {
  const generated = new Date().toISOString().slice(0, 10)
  const table = rows
    .map(([label, value, budget]) => `| ${label} | ${bytes(value)} | ${bytes(budget)} |`)
    .join('\n')
  const report = `# Performance audit\n\nBaseline generated ${generated} from a production build after refreshing the local OSM boundary snapshots. Budgets are intentionally conservative regression guards, not claims about network transfer size after HTTP compression.\n\n| Measure | Current build | Budget |\n| --- | ---: | ---: |\n${table}\n\nLargest data file: \`${largestData.path.replaceAll('\\', '/')}\`.\n\nThe audit is run in CI and during GitHub Pages deployment via \`npm run performance:check\`. The deployment run is the authoritative map-data check because it regenerates the current boundary snapshots before building.\n`
  await writeFile('docs/performance-audit.md', report)
}
""")

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace(
              "- [ ] Acquire municipality-authorized georeferenced boundary geometry.\n- [ ] Validate the OSM-derived geometry against a municipality-authorized source before treating it as official municipal boundary data.\n\nTracking issue: [Acquire authoritative Vaasa boundary geometry](https://github.com/amirmojiry/vaasa-aluekartta/issues/2).\n",
