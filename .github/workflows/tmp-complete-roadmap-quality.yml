          ci.write_text(text)

          deploy = Path('.github/workflows/deploy-pages.yml')
          text = deploy.read_text()
          text = text.replace('  contents: read\n  pages: write', '  contents: write\n  pages: write', 1)
          text = text.replace(
              "      - name: Build\n        run: npm run build\n      - name: Configure Pages",
              "      - name: Build\n        run: npm run build\n      - name: Check performance budgets\n        run: npm run performance:check\n      - name: Configure Pages",
              1,
          )
          text = text.replace(
              "      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n",
              "      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n      - name: Check out release metadata\n        uses: actions/checkout@v4\n      - name: Publish stable release if needed\n        env:\n          GH_TOKEN: ${{ github.token }}\n        run: |\n          tag=\"v$(node -p \"require('./package.json').version\")\"\n          if gh release view \"$tag\" >/dev/null 2>&1; then\n            echo \"Release $tag already exists.\"\n            exit 0\n          fi\n          gh release create \"$tag\" --target \"$GITHUB_SHA\" --title \"Vaasa Aluekartta $tag\" --generate-notes\n",
              1,
          )
          deploy.write_text(text)
          PY
      - name: Install dependencies and Playwright
        run: |
          npm pkg set version=1.0.0
          npm pkg set scripts.test:e2e="playwright test"
          npm pkg set scripts.performance:check="node scripts/audit-performance.mjs"
          npm install --save-dev @playwright/test --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Format
        run: npm run format
      - name: Refresh boundary data for the performance baseline
        run: npm run data:update
      - name: Validate application
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run performance:check -- --write-report
          npm run test:e2e
          npm run format:check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md package.json package-lock.json playwright.config.ts e2e/core-journeys.spec.ts scripts/audit-performance.mjs docs/performance-audit.md src/components/map/VaasaMap.vue src/styles/main.css .github/workflows/ci.yml .github/workflows/deploy-pages.yml
          git commit -m "Complete roadmap quality milestone"
          git push origin HEAD:agent/complete-roadmap-quality
