name: Complete remaining roadmap quality items

on:
  push:
    branches:
      - agent/complete-roadmap-quality

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/complete-roadmap-quality
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply roadmap changes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          vaasa = Path('src/components/map/VaasaMap.vue')
          text = vaasa.read_text()
          text = text.replace(
              "const selectedLevel = ref<BoundaryLevel>('suuralue')",
              "const boundaryLevelFromUrl = (): BoundaryLevel =>\n  new URLSearchParams(window.location.search).get('level') === 'pienalue' ? 'pienalue' : 'suuralue'\nconst selectedLevel = ref<BoundaryLevel>(boundaryLevelFromUrl())",
              1,
          )
          text = text.replace(
              "function selectLevel(level: BoundaryLevel): void {\n  selectedLevel.value = level\n}",
              "function selectLevel(level: BoundaryLevel): void {\n  if (selectedLevel.value === level) return\n  selectedLevel.value = level\n  const search = new URLSearchParams(window.location.search)\n  search.set('level', level)\n  window.history.pushState(null, '', `${window.location.pathname}?${search.toString()}${window.location.hash}`)\n}\n\nfunction handlePopState(): void {\n  const nextLevel = boundaryLevelFromUrl()\n  if (selectedLevel.value !== nextLevel) selectedLevel.value = nextLevel\n}",
              1,
          )
          text = text.replace(
              "onMounted(() => {\n  if (!mapElement.value) return",
              "onMounted(() => {\n  window.addEventListener('popstate', handlePopState)\n  if (!mapElement.value) return",
              1,
          )
          text = text.replace(
              "onBeforeUnmount(() => {\n  renderToken += 1",
              "onBeforeUnmount(() => {\n  window.removeEventListener('popstate', handlePopState)\n  renderToken += 1",
              1,
          )
          text = text.replace(
              '<span class="map-card__status">{{ mapStatus }}</span>',
              '<span class="map-card__status" role="status" aria-live="polite">{{ mapStatus }}</span>',
              1,
          )
          for expression in [
              "visualizationMetric === 'none'",
              "visualizationMetric === 'population'",
              "visualizationMetric === 'employment'",
              "visualizationMetric === 'students'",
              "visualizationMetric === 'income'",
              "isLanguageMetric",
              "visualizationMetric === 'language-finnish'",
              "visualizationMetric === 'language-swedish'",
              "visualizationMetric === 'language-other'",
          ]:
              needle = f':class="{{ \'is-active\': {expression} }}"\n'
              replacement = needle + f'          :aria-pressed="{expression}"\n'
              if needle not in text:
                  raise SystemExit(f'Missing visualization button expression: {expression}')
              text = text.replace(needle, replacement, 1)
          text = text.replace(
              '      :aria-label="`${t(\'statisticalAreas\')} · ${selectedLayerLabel}`"\n    />',
              '      :aria-label="`${t(\'statisticalAreas\')} · ${selectedLayerLabel}`"\n      tabindex="0"\n    />',
              1,
          )
          vaasa.write_text(text)

          main_css = Path('src/styles/main.css')
          css = main_css.read_text()
          accessibility = """

/* Quality milestone: consistent touch targets and resilient small-screen controls. */
.boundary-level-control__button,
.map-visualization-control button,
.map-language-subcontrol button,
.poi-control button,
.address-search input,
.address-search button,
select,
summary {
  min-height: 2.75rem;
}

button,
input,
select,
summary {
  touch-action: manipulation;
}
"""
          marker = "\n@media (max-width: 850px) {"
          if marker not in css:
              raise SystemExit('Missing main.css responsive marker')
          css = css.replace(marker, accessibility + marker, 1)
          css = css.replace(
              "  .topbar {\n    min-height: 4.5rem;\n  }",
              "  .topbar {\n    gap: 0.75rem;\n    min-height: 4.5rem;\n    padding-block: 0.5rem;\n    flex-wrap: wrap;\n  }\n\n  .topbar__actions {\n    flex-wrap: wrap;\n  }\n\n  .map-card {\n    padding: 0.75rem;\n  }",
              1,
          )
          css = css.replace(
              "@media (prefers-reduced-motion: reduce) {\n  html {\n    scroll-behavior: auto;\n  }\n}",
              "@media (prefers-reduced-motion: reduce) {\n  html {\n    scroll-behavior: auto;\n  }\n\n  *,\n  *::before,\n  *::after {\n    animation-duration: 0.01ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 0.01ms !important;\n  }\n}",
              1,
          )
          main_css.write_text(css)

          Path('playwright.config.ts').write_text("""import { defineConfig, devices } from '@playwright/test'\n\nexport default defineConfig({\n  testDir: './e2e',\n  fullyParallel: true,\n  timeout: 30_000,\n  expect: { timeout: 8_000 },\n  use: {\n    baseURL: 'http://127.0.0.1:4173',\n    trace: 'retain-on-failure',\n  },\n  webServer: {\n    command: 'npm run preview -- --host 127.0.0.1 --port 4173',\n    url: 'http://127.0.0.1:4173/vaasa-aluekartta/',\n    reuseExistingServer: false,\n    timeout: 120_000,\n  },\n  projects: [\n    {\n      name: 'chromium',\n      use: { ...devices['Desktop Chrome'] },\n    },\n  ],\n})\n""")

          Path('e2e').mkdir(exist_ok=True)
          Path('e2e/core-journeys.spec.ts').write_text(r"""import { expect, test, type Page } from '@playwright/test'

const majorBoundary = {
