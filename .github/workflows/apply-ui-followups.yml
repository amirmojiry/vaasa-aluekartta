name: Apply UI followups

on:
  push:
    branches:
      - agent/fix-party-links-postal-poi-scope

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-party-links-postal-poi-scope

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply requested UI fixes
        run: node scripts/apply-ui-followups-temp.mjs

      - name: Format and type-check
        run: |
          npm install --no-audit --no-fund
          npx prettier --write src/components/areas/ElectionLineChart.vue src/components/postal/PostalCodeDetail.vue src/poiI18n.ts src/styles/pois.css
          npm run typecheck

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/areas/ElectionLineChart.vue src/components/postal/PostalCodeDetail.vue src/poiI18n.ts src/styles/pois.css
          git commit -m "Fix party links and postal POI scope"
          git push origin HEAD:agent/fix-party-links-postal-poi-scope
