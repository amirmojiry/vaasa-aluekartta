name: Temporary E2 location proof

on:
  push:
    branches: [agent/events-e2-location-resolution]

concurrency:
  group: temporary-e2-location-proof
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[run-e2]')
    runs-on: ubuntu-latest
    env:
      NLS_API_KEY: ${{ secrets.NLS_API_KEY }}
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/events-e2-location-resolution
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Report NLS key availability
        run: |
          if [ -n "$NLS_API_KEY" ]; then
            echo "NLS_API_KEY is configured; remote E2 geocoding will be exercised."
          else
            echo "NLS_API_KEY is not configured; E2 will remain local-only and the exit gate stays open."
          fi
      - name: Format E2 files
        run: >-
          npx prettier --write
          src/domain/event.ts
          src/domain/location.ts
          scripts/lib/event-location.mjs
          scripts/lib/event-location.spec.mjs
          scripts/lib/nls-geocoder.mjs
          scripts/lib/nls-geocoder.spec.mjs
          scripts/resolve-event-locations.mjs
          scripts/validate-event-locations.mjs
          docs/event-location-resolution.md
          package.json
          public/data/location-cache.json
      - name: Generate location-resolution proof
        run: npm run events:locations
      - name: Run focused E2 tests
        run: npx vitest run scripts/lib/event-location.spec.mjs scripts/lib/nls-geocoder.spec.mjs
      - name: Run repository checks
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          npm run build
      - name: Commit formatted files and generated proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/domain/event.ts \
            src/domain/location.ts \
            scripts/lib/event-location.mjs \
            scripts/lib/event-location.spec.mjs \
            scripts/lib/nls-geocoder.mjs \
            scripts/lib/nls-geocoder.spec.mjs \
            scripts/resolve-event-locations.mjs \
            scripts/validate-event-locations.mjs \
            docs/event-location-resolution.md \
            package.json \
            public/data/location-cache.json \
            public/data/event-locations.json \
            public/data/event-location-report.json
          if git diff --cached --quiet; then
            echo "E2 proof is already current"
            exit 0
          fi
          git commit -m "Generate E2 location proof"
          git push origin HEAD:agent/events-e2-location-resolution
