name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Probe events feed coverage
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://events.osterbotten.fi/EventService/search?Locale=en_US&Municipalities=2&SortField=Date&SortDir=ASC&Format=rss'
          const probes = [
            ['limit100', `${base}&Limit=100`],
            ['limit101', `${base}&Limit=101`],
            ['limit200', `${base}&Limit=200`],
            ['page2', `${base}&Limit=100&CurrentPage=2`],
          ]
          for (const [name, url] of probes) {
            try {
              const response = await fetch(url, { redirect: 'follow', signal: AbortSignal.timeout(15000) })
              const text = await response.text()
              const items = [...text.matchAll(/<item>/g)].length
              const guids = [...text.matchAll(/<guid[^>]*>([^<]+)<\/guid>/g)].map((m) => m[1])
              console.log(JSON.stringify({
                name,
                status: response.status,
                contentType: response.headers.get('content-type'),
                contentLength: text.length,
                items,
                firstGuid: guids[0] ?? null,
                lastGuid: guids.at(-1) ?? null,
                uniqueGuids: new Set(guids).size,
              }))
            } catch (error) {
              console.log(JSON.stringify({ name, error: error?.name ?? String(error) }))
            }
          }
          NODE
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Check performance budgets
        run: npm run performance:check
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
