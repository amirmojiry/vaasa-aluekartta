name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Show formatting diff
        run: |
          npx prettier --write scripts/update-osm-boundaries.mjs src/components/areas/AreaDetail.vue src/components/areas/PienalueDetail.vue src/i18n.ts src/services/boundaryData.ts
          git diff -- scripts/update-osm-boundaries.mjs src/components/areas/AreaDetail.vue src/components/areas/PienalueDetail.vue src/i18n.ts src/services/boundaryData.ts
          git checkout -- scripts/update-osm-boundaries.mjs src/components/areas/AreaDetail.vue src/components/areas/PienalueDetail.vue src/i18n.ts src/services/boundaryData.ts
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
